name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare release signing
        if: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > custodian-release.jks
      - name: Build release APK and AAB
        env:
          CUSTODIAN_STORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
          CUSTODIAN_KEY_ALIAS: ${{ secrets.CUSTODIAN_KEY_ALIAS }}
          CUSTODIAN_KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
        run: |
          if [ -f custodian-release.jks ]; then
            gradle assembleRelease bundleRelease -PCUSTODIAN_STORE_FILE="$GITHUB_WORKSPACE/custodian-release.jks" -PCUSTODIAN_STORE_PASSWORD="$CUSTODIAN_STORE_PASSWORD" -PCUSTODIAN_KEY_ALIAS="$CUSTODIAN_KEY_ALIAS" -PCUSTODIAN_KEY_PASSWORD="$CUSTODIAN_KEY_PASSWORD"
          else
            gradle assembleRelease bundleRelease
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: custodian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: custodian-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: custodian-release-aab
          path: app/build/outputs/bundle/release/*.aab