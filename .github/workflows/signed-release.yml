name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CUSTODIAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing CUSTODIAN_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing CUSTODIAN_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing CUSTODIAN_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing CUSTODIAN_KEY_PASSWORD"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" |
            tr -d '[:space:]' |
            base64 --decode > "$RUNNER_TEMP/custodian-signing.keystore"
          test -s "$RUNNER_TEMP/custodian-signing.keystore" || {
            echo "Keystore decode produced an empty file"
            exit 1
          }
          chmod 600 "$RUNNER_TEMP/custodian-signing.keystore"

      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/custodian-signing.keystore"             -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Run unit tests
        run: gradle test

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CUSTODIAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
        run: |
          gradle assembleRelease             -PCUSTODIAN_STORE_FILE="$RUNNER_TEMP/custodian-signing.keystore"             -PCUSTODIAN_STORE_PASSWORD="$KEYSTORE_PASSWORD"             -PCUSTODIAN_KEY_ALIAS="$KEY_ALIAS"             -PCUSTODIAN_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          SDK_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: custodian-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
