name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CUSTODIAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing CUSTODIAN_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing CUSTODIAN_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing CUSTODIAN_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing CUSTODIAN_KEY_PASSWORD"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          # Expected secret format: the complete custodian-release.jks file encoded as Base64.
          # Whitespace/newlines are allowed; URL-safe Base64 is also accepted.
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | sed -E 's/^"//; s/"$//')
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | sed -E 's#^data:[^,]*;base64,##')
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | tr '_-' '/+')

          test -n "$CLEAN_BASE64" || {
            echo "CUSTODIAN_KEYSTORE_BASE64 is empty after normalization."
            exit 1
          }

          REMAINDER=$(( ${#CLEAN_BASE64} % 4 ))
          if [ "$REMAINDER" -eq 2 ]; then
            CLEAN_BASE64="${CLEAN_BASE64}=="
          elif [ "$REMAINDER" -eq 3 ]; then
            CLEAN_BASE64="${CLEAN_BASE64}="
          elif [ "$REMAINDER" -eq 1 ]; then
            echo "CUSTODIAN_KEYSTORE_BASE64 is malformed: invalid Base64 length."
            echo "Replace the secret with the complete Base64 output of the .jks file; do not paste the .jks filename, path, or a truncated value."
            exit 1
          fi

          if printf '%s' "$CLEAN_BASE64" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "CUSTODIAN_KEYSTORE_BASE64 contains characters outside the Base64 alphabet."
            exit 1
          fi

          if ! printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/custodian-signing.keystore" 2>/dev/null; then
            echo "CUSTODIAN_KEYSTORE_BASE64 could not be decoded. The secret must contain the complete Base64-encoded keystore."
            exit 1
          fi

          test -s "$RUNNER_TEMP/custodian-signing.keystore" || {
            echo "Decoded keystore is empty."
            exit 1
          }

          chmod 600 "$RUNNER_TEMP/custodian-signing.keystore"

      - name: Validate keystore and select password
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if keytool -list -keystore "$RUNNER_TEMP/custodian-signing.keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            printf 'CUSTODIAN_EFFECTIVE_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif keytool -list -keystore "$RUNNER_TEMP/custodian-signing.keystore" -storepass "$KEY_PASSWORD" >/dev/null 2>&1; then
            printf 'CUSTODIAN_EFFECTIVE_STORE_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "The decoded keystore is not readable with either configured password."
            echo "Check CUSTODIAN_KEYSTORE_PASSWORD and CUSTODIAN_KEY_PASSWORD against the keystore."
            exit 1
          fi

      - name: Run unit tests
        run: gradle test

      - name: Build signed release APK
        env:
          KEY_ALIAS: ${{ secrets.CUSTODIAN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease \
            -PCUSTODIAN_STORE_FILE="$RUNNER_TEMP/custodian-signing.keystore" \
            -PCUSTODIAN_STORE_PASSWORD="$CUSTODIAN_EFFECTIVE_STORE_PASSWORD" \
            -PCUSTODIAN_KEY_ALIAS="$KEY_ALIAS" \
            -PCUSTODIAN_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: custodian-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
