name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore configured signing keystore
        id: configured_keystore
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.CUSTODIAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | sed -E 's/^"//; s/"$//')
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | sed -E 's#^data:[^,]*;base64,##')
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | tr '_-' '/+')
          test -n "$CLEAN_BASE64"
          REMAINDER=$(( ${#CLEAN_BASE64} % 4 ))
          if [ "$REMAINDER" -eq 2 ]; then CLEAN_BASE64="${CLEAN_BASE64}=="; fi
          if [ "$REMAINDER" -eq 3 ]; then CLEAN_BASE64="${CLEAN_BASE64}="; fi
          if [ "$REMAINDER" -eq 1 ]; then exit 1; fi
          printf '%s' "$CLEAN_BASE64" | base64 --decode > "$RUNNER_TEMP/custodian-signing.keystore"
          test -s "$RUNNER_TEMP/custodian-signing.keystore"
          chmod 600 "$RUNNER_TEMP/custodian-signing.keystore"

      - name: Validate configured keystore
        id: configured_passwords
        if: steps.configured_keystore.outcome == 'success'
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CUSTODIAN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CUSTODIAN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CUSTODIAN_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if keytool -list -keystore "$RUNNER_TEMP/custodian-signing.keystore" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            STORE="$KEYSTORE_PASSWORD"
          elif keytool -list -keystore "$RUNNER_TEMP/custodian-signing.keystore" -storepass "$KEY_PASSWORD" >/dev/null 2>&1; then
            STORE="$KEY_PASSWORD"
          else
            exit 1
          fi
          {
            echo "CUSTODIAN_EFFECTIVE_STORE_PASSWORD=$STORE"
            echo "CUSTODIAN_EFFECTIVE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CUSTODIAN_EFFECTIVE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Generate fallback release key
        if: steps.configured_keystore.outcome != 'success' || steps.configured_passwords.outcome != 'success'
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/custodian-signing.keystore"
          STORE_PASSWORD=$(openssl rand -hex 24)
          KEY_ALIAS=custodian-release
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/custodian-signing.keystore"             -storetype PKCS12             -storepass "$STORE_PASSWORD"             -keypass "$STORE_PASSWORD"             -alias "$KEY_ALIAS"             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Custodian, OU=Android, O=Custodian, L=Port Harcourt, ST=Rivers, C=NG"
          {
            echo "CUSTODIAN_EFFECTIVE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CUSTODIAN_EFFECTIVE_KEY_PASSWORD=$STORE_PASSWORD"
            echo "CUSTODIAN_EFFECTIVE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle test

      - name: Build signed release APK and AAB
        run: |
          set -euo pipefail
          gradle assembleRelease bundleRelease             -PCUSTODIAN_STORE_FILE="$RUNNER_TEMP/custodian-signing.keystore"             -PCUSTODIAN_STORE_PASSWORD="$CUSTODIAN_EFFECTIVE_STORE_PASSWORD"             -PCUSTODIAN_KEY_ALIAS="$CUSTODIAN_EFFECTIVE_KEY_ALIAS"             -PCUSTODIAN_KEY_PASSWORD="$CUSTODIAN_EFFECTIVE_KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          SDK_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: custodian-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: custodian-signed-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
